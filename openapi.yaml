openapi: 3.0.3
info:
  title: Autonoma API
  description: |
    API for managing test runs and test definitions in the Autonoma platform.

    **Important Note:** Media URLs (images, videos) expire after 1 hour.
  version: 1.0.0
  contact:
    name: Autonoma Support
servers:
  - url: https://autonoma.app/api
    description: Production server
security:
  - ApiKeyAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: autonoma-client-id
      description: Client ID for authentication
    ApiSecretAuth:
      type: apiKey
      in: header
      name: autonoma-client-secret
      description: Client secret for authentication
  schemas:
    RunTestRequest:
      type: object
      properties:
        application_version_id:
          type: string
          description: Run with a specific application version
          example: "cm7dbowr80042waka7thyjhkq"
        environment_application_version_id:
          type: string
          description: Use a different version for the run environment
          example: "cm7dbowr80042waka7thyjhkq"
        run_on_latest:
          type: boolean
          description: Run with the latest application version
          example: true
        runtime_metadata:
          type: object
          description: Variables to override when test is running, if variable does not match any of your saved variables it will ignore it
          additionalProperties:
            type: string
          example:
            NAME: "CompanyName"
            ENVIRONMENT: "staging"
            API_KEY: "test-key-123"
        source:
          type: string
          description: Source identifier (max 10 chars), defaults to "api"
          default: "api"
          example: "api"
        use_physical_device:
          type: boolean
          description: Run on a physical device instead of simulator/emulator. Requires Device Farm to be enabled and for iOS, a .ipa file must be uploaded as physicalDevicePath for the application version.
          example: true
        device_arn:
          type: string
          description: "Specific AWS Device Farm device ARN to use. Priority: API device_arn over Test config deviceFarmDeviceArn over Org default device"
          example: "arn:aws:devicefarm:us-west-2::device:ABC123..."
    RunFolderRequest:
      type: object
      properties:
        application_version_id:
          type: string
          description: Optional application version ID to use for all tests in the folder
          example: "cm7dbowr80042waka7thyjhkq"
        source:
          type: string
          description: Source of the test run request
          default: "api"
          example: "api"
    RunTagRequest:
      type: object
      required:
        - tag_ids
      properties:
        tag_ids:
          type: array
          description: IDs of the tags to run
          items:
            type: string
          example: ["cm7dbowr80042waka7thyjhkq", "cm8xf3wp90123abcd4efgh5ij"]
        application_versions:
          type: array
          description: Applications used by running tests
          items:
            type: object
            properties:
              application_id:
                type: string
                description: Optional application ID
                example: "cm7dbowr80042waka7thyjhkq"
              application_version_ids:
                type: array
                description: Optional application version IDs
                items:
                  type: string
                example:
                  ["cm7dbowr80042waka7thyjhkq", "cm8xf3wp90123abcd4efgh5ij"]
          example:
            - application_id: "cm7dbowr80042waka7thyjhkq"
              application_version_ids:
                ["cm7dbowr80042waka7thyjhkq", "cm8xf3wp90123abcd4efgh5ij"]
            - application_id: "cm9xyz12340567pqrs8tuvwxy"
              application_version_ids:
                ["cm9abc34560789defg0hijklm", "cm0nop78901234qrst5uvwxyz"]
    TestFolder:
      type: object
      properties:
        id:
          type: string
          example: "cm7t223mk00154mzy2jwk2pqy"
        name:
          type: string
          example: "private-listing-hub"
    ApplicationVersion:
      type: object
      properties:
        name:
          type: string
          example: "STG"
        path:
          type: string
          example: "https://autonoma.app"
        customID:
          type: string
          nullable: true
          description: Custom identifier for the version (e.g., "build-123", "release-v2.0")
          example: "build-123"
    VersionResponse:
      type: object
      properties:
        id:
          type: string
          example: "cm7dbowr80042waka7thyjhkr"
        name:
          type: string
          example: "1.0.0"
        customID:
          type: string
          nullable: true
          description: Custom identifier for the version
          example: "build-123"
        path:
          type: string
          description: Cloud storage path for the simulator/emulator file
          example: "gs://bucket/path/to/app.apk"
        physicalDevicePath:
          type: string
          nullable: true
          description: Cloud storage path for the physical device file (`.ipa` for iOS)
          example: "gs://bucket/path/to/app.ipa"
        minimumIOSVersion:
          type: string
          nullable: true
          description: Minimum iOS version extracted from the `.ipa` file's `Info.plist`
          example: "15.0"
        tag:
          type: string
          example: "main"
        createdAt:
          type: string
          format: date-time
          example: "2024-12-12T18:13:36.000Z"
        application:
          type: object
          properties:
            id:
              type: string
              example: "cm7dbowr80042waka7thyjhkq"
            name:
              type: string
              example: "MyApp"
            applicationType:
              type: string
              enum: [android, ios, web]
              example: "android"
    Metadata:
      type: object
      properties:
        source:
          type: string
          example: "scheduled"
        version:
          type: string
          example: "STG"
        architecture:
          type: string
          example: "web"
        application_version_id:
          type: string
          example: "cm7dbowr80042waka7thyjhkq"
        email:
          type: string
          example: "axel@autonoma.app"
        username:
          type: string
          example: "Axel Escalada"
    Element:
      type: object
      properties:
        html:
          type: string
          example: '<input class="input c2053dbb5 c10f8401f" inputmode="email" name="username" id="username" type="text" value="" required="" autocomplete="email" autocapitalize="none" spellcheck="false" autofocus=""'
        selector:
          type: string
          example: "input#username"
    Step:
      type: object
      properties:
        id:
          type: string
          example: "cmbs5deso0001ps016az80n89"
        instruction:
          type: string
          example: "insert {{variable:QA_ADMIN_USER}} into log in input"
        interaction:
          type: string
          example: "input-text"
        output:
          type: string
          example: "input-text on element with text axel@autonoma.app"
        status:
          type: string
          enum: [passed, failed, pending]
          example: "passed"
        url:
          type: string
          example: "https://login.autonoma.app/login"
        element:
          $ref: "#/components/schemas/Element"
        image:
          type: string
          description: "Screenshot URL (expires in 1 hour)"
          example: "https://storage.googleapis.com/autonoma-media/screenshots/d8e41de595af.jpeg"
    RunTest:
      type: object
      properties:
        message:
          type: string
          example: "Test run triggered successfully"
        url:
          type: string
          example: "https://autonoma.app/run/pby4qnbppbvimimuls4v5ajq"
        runID:
          type: string
          example: "pby4qnbppbvimimuls4v5ajq"
        runGroupID:
          type: string
          description: Group ID for the test run
          example: "pby4qnbppbvimimuls4v5ajq"
    RunFolder:
      type: object
      properties:
        message:
          type: string
          example: "Folder with id cm9r0nog10012v301qtollv01 was scheduled to run. Since no applicationVersionID was provided, the latest version ('STG') for the application associated with the folder's tests was used."
        url:
          type: string
          example: "https://autonoma.app/run/folder/pby4qnbppbvimimuls4v5ajq"
        folder_run_id:
          type: string
          example: pby4qnbppbvimimuls4v5ajq
    RunTag:
      type: object
      properties:
        message:
          type: string
          example: "Runs with tags cm7dbowr80042waka7thyjhkq & cm8xf3wp90123abcd4efgh5ij were scheduled to run."
        url:
          type: string
          example: "https://autonoma.app/run/tag/pby4qnbppbvimimuls4v5ajq"
        folderRunID:
          type: string
          example: pby4qnbppbvimimuls4v5ajq
    TestRun:
      type: object
      properties:
        id:
          type: string
          example: "gch7uesq5h6m9xe2fdq5ddgd"
        name:
          type: string
          example: "Add 'member' to network, verify it can access the listings and remove it from the network"
        test_id:
          type: string
          example: "cm8d9gt6v000c9fe5glmyi33u"
        status:
          type: string
          enum: [pending, running, passed, failed]
          example: "pending"
        created_at:
          type: string
          format: date-time
          example: "2025-06-12T00:00:11.286Z"
        ended_at:
          type: string
          format: date-time
          example: "2025-06-12T00:00:11.286Z"
        folder_run_id:
          type: string
          nullable: true
          example: "y98cwdq4c3p3v3i68n7nay1p"
        job_run_id:
          type: string
          nullable: true
          example: null
        job_id:
          type: string
          nullable: true
          example: null
        folder:
          $ref: "#/components/schemas/TestFolder"
          nullable: true
        video_url:
          type: string
          nullable: true
          description: "Video URL (expires in 1 hour)"
          example: null
        steps:
          type: array
          items:
            $ref: "#/components/schemas/Step"
        metadata:
          $ref: "#/components/schemas/Metadata"
    Test:
      type: object
      properties:
        id:
          type: string
          example: "cmbsgljfr00fd060153r9x8ek"
        name:
          type: string
          example: "New Test 2025-06-11T21:25:47.442Z"
        created_at:
          type: string
          format: date-time
          example: "2025-06-11T21:25:47.559Z"
        folder:
          $ref: "#/components/schemas/TestFolder"
          nullable: true
        application_version:
          $ref: "#/components/schemas/ApplicationVersion"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/Step"
    Folder:
      type: object
      properties:
        id:
          type: string
          example: "cmbsgljfr00fd060153r9x8ek"
        name:
          type: string
          example: "Draft Folder"
        created_at:
          type: string
          format: date-time
          example: "2025-06-11T21:25:47.559Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-06-11T21:25:47.559Z"
        crontab:
          type: string
          example: "0 0 * * *"
        tests:
          type: array
          items:
            $ref: "#/components/schemas/FolderTest"
    FolderTest:
      type: object
      properties:
        id:
          type: string
          example: "cmbsgljfr00fd060153r9x8ek"
        name:
          type: string
          example: "New Test 2025-06-11T21:25:47.442Z"
    RunStatus:
      type: object
      properties:
        status:
          type: string
          example: "running"
        url:
          type: string
          example: "https://autonoma.app/run/cmbjp2vva000u0j01vtfu5kdj"
    FolderRunStatus:
      type: object
      properties:
        status:
          type: string
          example: "running"
        url:
          type: string
          example: "https://autonoma.app/run/folder/xt80n05xgkolyyhidswgw1z6"
    BadRequestError:
      type: object
      properties:
        error:
          type: string
          example: "Bad Request"
        message:
          type: string
          example: "No applicationVersionID provided, and could not automatically determine an application from the tests within folder cmbsgljfr00fd060153r9x8ek. Please specify an applicationVersionID or ensure at least one test has an associated application."
    InvalidCredentialsError:
      type: object
      properties:
        error:
          type: string
          example: "Unauthorized"
        message:
          type: string
          example: "Invalid authentication credentials"
    NotFoundError:
      type: object
      properties:
        error:
          type: string
          example: "Not found"
        message:
          type: string
          example: "Resource with id `cm8d9gt6v000c9fe5glmyi33u` not found"
    DeviceFarmConfig:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether Device Farm is enabled for the organization
          example: true
        project_arn:
          type: string
          description: AWS Device Farm project ARN
          example: "arn:aws:devicefarm:us-west-2:123456789012:project:abc123..."
        default_android_device_arn:
          type: string
          nullable: true
          description: Default Android device ARN
          example: "arn:aws:devicefarm:us-west-2::device:ABC123..."
        default_ios_device_arn:
          type: string
          nullable: true
          description: Default iOS device ARN
          example: "arn:aws:devicefarm:us-west-2::device:DEF456..."
    DeviceFarmDevice:
      type: object
      properties:
        arn:
          type: string
          description: AWS Device Farm device ARN
          example: "arn:aws:devicefarm:us-west-2::device:ABC123..."
        name:
          type: string
          description: Device name
          example: "Apple iPhone 16"
        model:
          type: string
          description: Device model
          example: "iPhone16,1"
        manufacturer:
          type: string
          description: Device manufacturer
          example: "Apple"
        platform:
          type: string
          enum: [IOS, ANDROID]
          description: Device platform
          example: "IOS"
        availability:
          type: string
          enum: [HIGHLY_AVAILABLE, AVAILABLE, BUSY, TEMPORARY_NOT_AVAILABLE]
          description: Device availability status
          example: "HIGHLY_AVAILABLE"
        formFactor:
          type: string
          enum: [PHONE, TABLET]
          description: Device form factor
          example: "PHONE"
        os:
          type: string
          description: Operating system version
          example: "18.0"
    DeviceFarmDevicesResponse:
      type: object
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/DeviceFarmDevice"
        default_device_arn:
          type: string
          nullable: true
          description: Default device ARN for the platform
          example: "arn:aws:devicefarm:us-west-2::device:ABC123..."
        project_arn:
          type: string
          description: AWS Device Farm project ARN
          example: "arn:aws:devicefarm:us-west-2:123456789012:project:abc123..."
paths:
  /test:
    get:
      summary: List tests
      description: Retrieve a list of test definitions with optional pagination
      security:
        - ApiKeyAuth: []
          ApiSecretAuth: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of tests to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            example: 20
        - name: offset
          in: query
          description: Number of tests to skip for pagination
          required: false
          schema:
            type: integer
            minimum: 0
            example: 0
        - name: steps
          in: query
          description: Include step details in response
          required: false
          schema:
            type: boolean
            example: true
        - name: folder
          in: query
          description: Retrieve tests by folder id
          required: false
          schema:
            type: string
            example: true
      responses:
        "200":
          description: List of tests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Test"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidCredentialsError"
  /test/{test_id}:
    get:
      summary: Get a specific test
      description: Retrieve details of a specific test definition by ID
      security:
        - ApiKeyAuth: []
          ApiSecretAuth: []
      parameters:
        - name: test_id
          in: path
          required: true
          description: The ID of the test
          schema:
            type: string
            example: "cmbjp2vva000u0j01vtfu5kdj"
        - name: steps
          in: query
          description: Include step details in response
          required: false
          schema:
            type: boolean
            example: true
      responses:
        "200":
          description: Test details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Test"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidCredentialsError"
        "404":
          description: Test not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
  /test/{test_id}/run:
    post:
      summary: Run test
      description: |
        Triggers a test run. The test can be configured to run on a physical device either through test configuration or API parameters.
        
        **Physical Device Runs**: A test will run on a physical device in either of these scenarios:
        1. **API Parameter**: Pass `use_physical_device: true` in the request body
        2. **Test Configuration**: The test has `deviceFarmRunEnabled: true` in its test configuration
        
        When running on a physical device:
        - The organization must have Device Farm enabled
        - For iOS: A `.ipa` file must be uploaded as the `physicalDevicePath` for the application version
        - For Android: Uses the same `.apk` file as emulator runs
        - Device ARN priority: API `device_arn` > Test config `deviceFarmDeviceArn` > Org default device
      security:
        - ApiKeyAuth: []
          ApiSecretAuth: []
      parameters:
        - name: test_id
          in: path
          required: true
          description: ID of the test to run
          schema:
            type: string
            example: "g41k688vndxzt7kh4kq5m12s"
      requestBody:
        required: false
        description: "Request body (optional)"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunTestRequest"
            examples:
              default_run:
                summary: Run test on simulator/emulator (default)
                value: {}
              physical_device:
                summary: Run test on physical device via API
                value:
                  use_physical_device: true
              specific_device:
                summary: Run test on specific physical device
                value:
                  use_physical_device: true
                  device_arn: "arn:aws:devicefarm:us-west-2::device:ABC123..."
              version_with_physical:
                summary: Run test with specific version on physical device
                value:
                  application_version_id: "version_456"
                  use_physical_device: true
      x-codeSamples:
        - lang: curl
          label: "Run on simulator/emulator (default)"
          source: |
            curl --location --request POST 'https://autonoma.app/api/test/g41k688vndxzt7kh4kq5m12s/run' \
            --header 'autonoma-client-id: YOUR_CLIENT_ID' \
            --header 'autonoma-client-secret: YOUR_CLIENT_SECRET' \
            --header 'Content-Type: application/json' \
            --data '{}'
        - lang: curl
          label: "Run on physical device"
          source: |
            curl --location --request POST 'https://autonoma.app/api/test/g41k688vndxzt7kh4kq5m12s/run' \
            --header 'autonoma-client-id: YOUR_CLIENT_ID' \
            --header 'autonoma-client-secret: YOUR_CLIENT_SECRET' \
            --header 'Content-Type: application/json' \
            --data '{"use_physical_device": true}'
        - lang: curl
          label: "Run on specific physical device"
          source: |
            curl --location --request POST 'https://autonoma.app/api/test/g41k688vndxzt7kh4kq5m12s/run' \
            --header 'autonoma-client-id: YOUR_CLIENT_ID' \
            --header 'autonoma-client-secret: YOUR_CLIENT_SECRET' \
            --header 'Content-Type: application/json' \
            --data '{"use_physical_device": true, "device_arn": "arn:aws:devicefarm:us-west-2::device:ABC123..."}'
      responses:
        "201":
          description: Test run triggered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunTest"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidCredentialsError"
        "403":
          description: Forbidden - Insufficient quota
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Forbidden"
                  message:
                    type: string
                    example: "Insufficient quota"
        "404":
          description: Test not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "500":
          description: Internal server error - Device Farm not configured or server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Internal Server Error"
                  message:
                    type: string
                    example: "Device Farm not configured"
  /folder:
    get:
      summary: List Folders
      description: Retrieve a list of folder definitions with optional pagination
      security:
        - ApiKeyAuth: []
          ApiSecretAuth: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of folders to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            example: 20
        - name: offset
          in: query
          description: Number of folders to skip for pagination
          required: false
          schema:
            type: integer
            minimum: 0
            example: 0
      responses:
        "200":
          description: List of Folders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Folder"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidCredentialsError"
  /folder/{folder_id}:
    get:
      summary: Get a specific folder
      description: Retrieve details of a specific folder definition by ID
      security:
        - ApiKeyAuth: []
          ApiSecretAuth: []
      parameters:
        - name: folder_id
          in: path
          required: true
          description: The ID of the folder
          schema:
            type: string
            example: "cmbjp2vva000u0j01vtfu5kdj"
      responses:
        "200":
          description: Folder details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        "404":
          description: Folder not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidCredentialsError"
  /folder/{folder_id}/run:
    post:
      summary: Run all tests within a folder
      description: "Executes all tests contained within the specified folder."
      security:
        - ApiKeyAuth: []
          ApiSecretAuth: []
      parameters:
        - name: folder_id
          in: path
          required: true
          description: id of the folder to run
          schema:
            type: string
            example: "g41k688vndxzt7kh4kq5m12s"
      requestBody:
        required: false
        description: "Request body (optional)"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunFolderRequest"
      responses:
        "200":
          description: Run creation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunFolder"
        "400":
          description: Bad request (e.g., missing application version)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidCredentialsError"
        "404":
          description: Folder not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
  /tag/run:
    post:
      summary: Run all tests that have a set of tags
      description: "Executes all tests that have all the specified tags."
      security:
        - ApiKeyAuth: []
          ApiSecretAuth: []
      requestBody:
        required: true
        description: "Request body"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunTagRequest"
      responses:
        "201":
          description: Run creation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunTag"
        "400":
          description: Bad request (e.g., missing application version)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidCredentialsError"
        "404":
