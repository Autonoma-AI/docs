  /application/{application_id}:
    patch:
      summary: Update application version
      description: |
        Creates a new application version for an existing application, or updates an existing version to add a physical device file. 
        Supports uploading both simulator/emulator files and physical device files (for iOS).
        
        **Creating a new version**: Upload a new `file` (APK for Android, ZIP for iOS, or provide `path` for web).
        
        **Updating an existing version**: When only `physicalDeviceFile` is provided (without `file`), the API will:
        - Look up the existing application version by `version` name or `customID`
        - Update the existing version with the physical device file
        - Extract and store the minimum iOS version from the `.ipa` file's `Info.plist`
        
        **Note**: At least one of `file` or `physicalDeviceFile` must be provided. If only `physicalDeviceFile` is provided, 
        either `version` or `customID` must be specified to identify the existing version.
      security:
        - ApiKeyAuth: []
          ApiSecretAuth: []
      parameters:
        - name: application_id
          in: path
          required: true
          description: The ID of the application to update
          schema:
            type: string
            example: "cm7dbowr80042waka7thyjhkq"
        - name: x-platform
          in: header
          required: true
          description: Application platform type
          schema:
            type: string
            enum: [android, ios, web]
            example: "android"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    The main application file. 
                    **Required** when creating a new application version.
                    **Optional** when only adding a physical device file to an existing version.
                    - **Android**: Must be an `.apk` file
                    - **iOS**: Must be a `.zip` file containing a `.app` bundle (for simulators)
                    - **Web**: Not required (use `path` field instead)
                physicalDeviceFile:
                  type: string
                  format: binary
                  description: |
                    Physical device application file (iOS only).
                    - **iOS only**: Must be a `.ipa` file
                    - When provided, the API will upload the `.ipa` file.
                    - **Adding to existing version**: If only `physicalDeviceFile` is provided (without `file`), 
                      either `version` or `customID` must be provided to identify the existing version
                tag:
                  type: string
                  description: "Version tag. One of: main, staging, other. Defaults to main"
                  enum: [main, staging, other]
                  example: "staging"
                cookies:
                  type: string
                  description: Optional cookies for web applications
                  example: "session=xyz789"
                version:
                  type: string
                  description: |
                    Version name for the new application version.
                    Required when creating a new version or when updating an existing version by version name.
                  example: "2.0.0"
                path:
                  type: string
                  description: URL path/URL for web applications
                  example: "https://myapp.com/v2"
                geolocation:
                  type: string
                  description: "JSON stringified geolocation object with latitude and longitude"
                  example: '{"latitude": 40.7128, "longitude": -74.0060}'
                customID:
                  type: string
                  description: |
                    Custom identifier for the version (e.g., "build-123", "release-v2.0").
                    Can be used to identify an existing version when updating with physicalDeviceFile only.
                  example: "build-123"
            examples:
              ios_new_version_with_physical:
                summary: iOS - Create New Version with Simulator and Physical Device Files
                description: Create a new iOS application version with both simulator and physical device files
                value:
                  version: "1.0.0"
                  tag: "main"
                  file: "@/Users/axel/Downloads/autonoma-bank.zip"
                  physicalDeviceFile: "@/Users/axel/Downloads/autonoma-bank.ipa"
              ios_add_physical_to_existing:
                summary: iOS - Add Physical Device File to Existing Version
                description: Add a physical device file to an existing version identified by version name
                value:
                  version: "1.0.0"
                  physicalDeviceFile: "@/Users/axel/Downloads/autonoma-bank.ipa"
              ios_add_physical_by_customid:
                summary: iOS - Add Physical Device File by customID
                description: Add a physical device file to an existing version identified by customID
                value:
                  customID: "build-123"
                  physicalDeviceFile: "@/Users/axel/Downloads/autonoma-bank.ipa"
              update_android:
                summary: Android - Create New Version
                description: Create a new Android application version
                value:
                  file: "@/path/to/updated_app.apk"
                  tag: "main"
                  customID: "build-456"
              update_web:
                summary: Web - Create New Version
                description: Create a new web application version
                value:
                  version: "2.0.0"
                  path: "https://myapp.com/v2"
                  cookies: "session=xyz789"
      x-codeSamples:
        - lang: curl
          label: "iOS - New Version with Simulator and Physical Device Files"
          source: |
            curl --location --request PATCH 'https://autonoma.app/api/mobile/cm7dbowr80042waka7thyjhkq' \
            --header 'autonoma-client-id: YOUR_CLIENT_ID' \
            --header 'autonoma-client-secret: YOUR_CLIENT_SECRET' \
            --header 'x-platform: ios' \
            --form 'version=1.0.0' \
            --form 'tag=main' \
            --form 'file=@"/Users/axel/Downloads/autonoma-bank.zip"' \
            --form 'physicalDeviceFile=@"/Users/axel/Downloads/autonoma-bank.ipa"'
        - lang: curl
          label: "iOS - Add Physical Device File to Existing Version"
          source: |
            curl --location --request PATCH 'https://autonoma.app/api/mobile/cm7dbowr80042waka7thyjhkq' \
            --header 'autonoma-client-id: YOUR_CLIENT_ID' \
            --header 'autonoma-client-secret: YOUR_CLIENT_SECRET' \
            --header 'x-platform: ios' \
            --form 'version=1.0.0' \
            --form 'physicalDeviceFile=@"/Users/axel/Downloads/autonoma-bank.ipa"'
        - lang: curl
          label: "iOS - Add Physical Device File by customID"
          source: |
            curl --location --request PATCH 'https://autonoma.app/api/mobile/cm7dbowr80042waka7thyjhkq' \
            --header 'autonoma-client-id: YOUR_CLIENT_ID' \
