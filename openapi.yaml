            --form 'physicalDeviceFile=@"/Users/axel/Downloads/autonoma-bank.ipa"'
        - lang: curl
          label: "Android"
          source: |
            curl --location --request PATCH 'https://autonoma.app/api/mobile/cm7dbowr80042waka7thyjhkq' \
            --header 'autonoma-client-id: YOUR_CLIENT_ID' \
