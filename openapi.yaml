        - lang: javascript
          label: "JavaScript - iOS with Physical Device File"
          source: |
            const formData = new FormData();
            formData.append('version', '1.0.0');
            formData.append('tag', 'main');
            formData.append('file', simulatorFileInput.files[0]);
